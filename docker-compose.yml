# Local stack: MongoDB + CareTrack API
#   docker compose up -d --build            → API on http://localhost:4000
#   docker compose --profile seed run --rm seed   → load demo data + admin user
name: caretrack-backend

x-api-env: &api-env
  MONGODB_URI: mongodb://mongo:27017/caretrack
  JWT_SECRET: ${JWT_SECRET:-local-docker-secret-please-change-me-0123456789}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  mongo:
    # MongoDB 8.x crashes on Linux kernels 6.19–7.0.13 (SERVER-121912), which includes
    # current Docker Desktop VMs. 7.0 is unaffected and supports every operator we use.
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [caretrack]

  api:
    build:
      context: .
      target: runtime
    image: caretrack-backend:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      <<: *api-env
      NODE_ENV: production
      PORT: 4000
      COOKIE_SECURE: 'false' # plain http on localhost
    networks: [caretrack]

  seed:
    build:
      context: .
      target: tools
    profiles: [seed]
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      <<: *api-env
      NODE_ENV: development
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@caretrack.dev}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-CareTrack@2026}
    networks: [caretrack]

volumes:
  mongo-data:

networks:
  # Fixed name so the frontend's compose file can attach to it.
  caretrack:
    name: caretrack-net
